<!-- Carga de Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div style="background: #0f172a; padding: 25px; border-radius: 16px; max-width: 950px; margin: 0 auto; color: #ffffff; font-family: sans-serif; border: 1px solid #334155;">
  <div style="display:flex; justify-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
    <div>
      <h2 style="margin:0; font-size: 24px; font-weight: bold; color: #ffffff;">RANKING DE VENTAS OFICIAL</h2>
      <p style="margin:4px 0 0 0; color: #94a3b8; font-size: 14px;">Datos consolidados por marca</p>
    </div>
  </div>

  <div style="position: relative; height: 420px; width: 100%;">
    <canvas id="moodleFixedChart"></canvas>
  </div>
</div>

<script>
  const topData = [
    { name: "Jayone Garijo Ruiz", ventas: 25, euros: "46.597,50 €", brands: "CEAC: 22 | CAMPUS: 3" },
    { name: "Manuel Jesus Aguilar Luque", ventas: 22, euros: "41.700,91 €", brands: "CEAC: 16 | CAMPUS: 6" },
    { name: "Isabel Abalo de Dios", ventas: 22, euros: "39.332,52 €", brands: "CEAC: 21 | CAMPUS: 1" },
    { name: "Rocio Gerpe Barreiros", ventas: 18, euros: "36.920,00 €", brands: "FLOU: 18" },
    { name: "Oscar Vilar Lombardero", ventas: 18, euros: "35.346,00 €", brands: "NUBIKA: 18" },
    { name: "Gloria María Compaire Izuel", ventas: 18, euros: "29.362,55 €", brands: "CEAC: 15 | CAMPUS: 3" },
    { name: "Beatriz Queiruga Penedo", ventas: 17, euros: "38.780,00 €", brands: "NUBIKA: 17" },
    { name: "Maria Cruz Baltodano Chavarria", ventas: 16, euros: "30.604,00 €", brands: "NUBIKA: 16" },
    { name: "Gabriel Antonio Donis Tato", ventas: 15, euros: "41.790,00 €", brands: "UNISPORT: 15" },
    { name: "Alvaro Tineo Meza", ventas: 15, euros: "35.985,00 €", brands: "35MM: 15" }
  ];

  document.addEventListener("DOMContentLoaded", function() {
    const ctx = document.getElementById('moodleFixedChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: topData.map(d => d.name),
        datasets: [{
          data: topData.map(d => d.ventas),
          backgroundColor: ['#ffd700', '#c0c0c0', '#cd7f32', '#00e676', '#00e676', '#00e676', '#00e676', '#00e676', '#00e676', '#00e676'],
          borderRadius: 6
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(c) {
                const item = topData[c.dataIndex];
                return ' ' + item.ventas + ' ventas (' + item.euros + ') - [' + item.brands + ']';
              }
            }
          }
        },
        scales: {
          x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
          y: { grid: { display: false }, ticks: { color: '#ffffff', font: { weight: 'bold' } } }
        }
      }
    });
  });
</script>
