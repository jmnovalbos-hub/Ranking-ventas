<!-- Librería Chart.js para gráficos de alto rendimiento -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div style="background: linear-gradient(145deg, #0f172a, #1e293b); padding: 28px; border-radius: 20px; max-width: 950px; margin: 20px auto; box-shadow: 0 15px 35px rgba(0,0,0,0.5); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; border: 1px solid #334155;">
  
  <!-- Encabezado y Controles -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
    <div>
      <h2 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0.5px;">RANKING DE VENTAS TOP 10</h2>
      <p style="color: #94a3b8; margin: 4px 0 0 0; font-size: 14px;">Resultados Consolidados del Período</p>
    </div>
    
    <!-- Botones para alternar Métrica -->
    <div style="display: flex; gap: 8px; background: #0f172a; padding: 4px; border-radius: 10px; border: 1px solid #334155;">
      <button id="btnVentas" onclick="updateRanking('ventas')" style="background: #00e676; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s;">Por Ventas</button>
      <button id="btnEuros" onclick="updateRanking('euros')" style="background: transparent; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s;">Por Facturación (€)</button>
    </div>
  </div>

  <!-- Contenedor del Gráfico -->
  <div style="position: relative; height: 420px; width: 100%;">
    <canvas id="moodleRankingChart"></canvas>
  </div>
</div>

<script>
  // Datos Top 10 consolidados por Ventas y Facturación
  const dataVentas = [
    { name: "Jayone Garijo Ruiz", value: 25, label: "25 ventas", sub: "46.597,50 €" },
    { name: "Manuel Jesus Aguilar Luque", value: 22, label: "22 ventas", sub: "41.700,91 €" },
    { name: "Isabel Abalo de Dios", value: 22, label: "22 ventas", sub: "39.332,52 €" },
    { name: "Rocio Gerpe Barreiros", value: 18, label: "18 ventas", sub: "36.920,00 €" },
    { name: "Oscar Vilar Lombardero", value: 18, label: "18 ventas", sub: "35.346,00 €" },
    { name: "Gloria María Compaire Izuel", value: 18, label: "18 ventas", sub: "29.362,55 €" },
    { name: "Beatriz Queiruga Penedo", value: 17, label: "17 ventas", sub: "38.780,00 €" },
    { name: "Maria Cruz Baltodano Chavarria", value: 16, label: "16 ventas", sub: "30.604,00 €" },
    { name: "Gabriel Antonio Donis Tato", value: 15, label: "15 ventas", sub: "41.790,00 €" },
    { name: "Alvaro Tineo Meza", value: 15, label: "15 ventas", sub: "35.985,00 €" }
  ];

  const dataEuros = [
    { name: "Jayone Garijo Ruiz", value: 46597.50, label: "46.597,50 €", sub: "25 ventas" },
    { name: "Gabriel Antonio Donis Tato", value: 41790.00, label: "41.790,00 €", sub: "15 ventas" },
    { name: "Manuel Jesus Aguilar Luque", value: 41700.91, label: "41.700,91 €", sub: "22 ventas" },
    { name: "Fátima Fernández Martínez", value: 41090.00, label: "41.090,00 €", sub: "12 ventas" },
    { name: "Maria Begoña Diaz Melendez", value: 39924.00, label: "39.924,00 €", sub: "12 ventas" },
    { name: "Isabel Abalo de Dios", value: 39332.52, label: "39.332,52 €", sub: "22 ventas" },
    { name: "Beatriz Queiruga Penedo", value: 38780.00, label: "38.780,00 €", sub: "17 ventas" },
    { name: "Rocio Gerpe Barreiros", value: 36920.00, label: "36.920,00 €", sub: "18 ventas" },
    { name: "Alvaro Tineo Meza", value: 35985.00, label: "35.985,00 €", sub: "15 ventas" },
    { name: "Oscar Vilar Lombardero", value: 35346.00, label: "35.346,00 €", sub: "18 ventas" }
  ];

  let currentChart = null;

  function renderChart(dataSet) {
    const ctx = document.getElementById('moodleRankingChart').getContext('2d');
    
    // Paleta de colores para Top 3 (Oro, Plata, Bronce) y resto
    const colors = [
      '#ffd700', '#c0c0c0', '#cd7f32', 
      '#00e676', '#00e676', '#00e676', '#00e676', '#00e676', '#00e676', '#00e676'
    ];

    if (currentChart) {
      currentChart.destroy();
    }

    currentChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataSet.map(d => d.name),
        datasets: [{
          data: dataSet.map(d => d.value),
          backgroundColor: colors,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                const item = dataSet[context.dataIndex];
                return ' ' + item.label + ' (' + item.sub + ')';
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            grid: { display: false },
            ticks: { color: '#ffffff', font: { weight: 'bold', size: 13 } }
          }
        }
      }
    });
  }

  function updateRanking(type) {
    const btnV = document.getElementById('btnVentas');
    const btnE = document.getElementById('btnEuros');

    if (type === 'ventas') {
      btnV.style.background = '#00e676';
      btnV.style.color = '#0f172a';
      btnE.style.background = 'transparent';
      btnE.style.color = '#94a3b8';
      renderChart(dataVentas);
    } else {
      btnE.style.background = '#00e676';
      btnE.style.color = '#0f172a';
      btnV.style.background = 'transparent';
      btnV.style.color = '#94a3b8';
      renderChart(dataEuros);
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    renderChart(dataVentas);
  });
</script>
