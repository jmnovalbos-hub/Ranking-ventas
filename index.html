<style>
  .neg-dashboard {

  .neg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;

    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .neg-title h2 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(90deg, #ffffff, #00e676);

    -webkit-text-fill-color: transparent;

  }

  .neg-title p {
    margin: 4px 0 0 0;
    color: #94a3b8;
    font-size: 14px;
  }

  .neg-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .neg-btn {
    background: rgba(30, 41, 59, 0.7);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .neg-btn:hover {
    background: rgba(51, 65, 85, 0.8);
    color: #ffffff;
  }

  .neg-btn.active {
    background: #00e676;
    color: #0b0f19;
    border-color: #00e676;
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
  }

  .neg-filter-select, .neg-search-input {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    outline: none;
  }

  .neg-search-input:focus, .neg-filter-select:focus {
    border-color: #00e676;
  }

  /* Podio 2-1-3 */
  .neg-podium-container {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 30px;
    padding: 10px 0;
  }

  .neg-podium-card {
    background: rgba(30, 41, 59, 0.5);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    width: 30%;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.3s ease;
  }

  .neg-podium-card:hover {
    transform: translateY(-5px);
  }

  .neg-podium-card.rank-1 {
    order: 2;
    width: 35%;
    border: 2px solid #ffd700;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
    background: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, rgba(30,41,59,0.6) 100%);
  }

  .neg-podium-card.rank-2 {
    order: 1;
    border: 1px solid #c0c0c0;
  }

  .neg-podium-card.rank-3 {
    order: 3;
    border: 1px solid #cd7f32;
  }

  .neg-badge {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px auto;
    font-weight: 800;
    font-size: 16px;
    color: #0b0f19;
  }

  .rank-1 .neg-badge { background: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .rank-2 .neg-badge { background: #c0c0c0; }
  .rank-3 .neg-badge { background: #cd7f32; }

  .neg-advisor-name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .neg-advisor-val {
    font-size: 20px;
    font-weight: 800;
    color: #00e676;
  }

  .neg-advisor-brands {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    line-height: 1.3;
  }

  /* Grid Layout */
  .neg-main-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .neg-card {
    background: rgba(30, 41, 59, 0.4);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;

    height: 380px;
    width: 100%;

  .neg-table-wrapper {

    overflow-y: auto;

  .neg-table {

    color: #e2e8f0;
  }

<div class="neg-dashboard">
  <!-- Encabezado y Controles -->
  <div class="neg-header">
    <div class="neg-title">

      <p>Dashboard Ejecutivo de Rendimiento</p>

    <div class="neg-controls">

  </div>

  </div>

  <!-- Gráfica Principal -->

    <div class="neg-card">
      <div class="neg-chart-wrapper">
        <canvas id="negChart"></canvas>
      </div>
    </div>

          </tbody>
        </table>
      </div>
    </div>

</div>

  let currentMetric = 'ventas';
  let currentRange = 10;
  let chartInstance = null;

  function formatEur(val) {
    return val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }

  function filterData() {
    const search = document.getElementById('negSearch').value.toLowerCase();
    const selectedBrand = document.getElementById('negBrandSelect').value;

    let filtered = fullAdvisorsData.filter(item => {
      const matchesSearch = item.name.toLowerCase().includes(search);
      const matchesBrand = (selectedBrand === 'ALL') || (item.brands_dict && item.brands_dict[selectedBrand] > 0);
      return matchesSearch && matchesBrand;
    });

    // Ordenar según métrica activa
    filtered.sort((a, b) => {
      if (currentMetric === 'ventas') {
        return b.ventas - a.ventas || b.euros - a.euros;
      } else {
        return b.euros - a.euros || b.ventas - a.ventas;
      }
    });

    // Aplicar rango Top N
    let displayList = (currentRange > 0) ? filtered.slice(0, currentRange) : filtered;

    renderPodium(filtered.slice(0, 3));
    renderChart(displayList);
    renderTable(displayList);
  }

  function renderPodium(top3) {
    const podiumEl = document.getElementById('negPodium');
    podiumEl.innerHTML = '';

    if (top3.length === 0) {
      podiumEl.style.display = 'none';
      return;
    }
    podiumEl.style.display = 'flex';

    top3.forEach((item, index) => {
      const rank = index + 1;
      const card = document.createElement('div');
      card.className = `neg-podium-card rank-${rank}`;

      const valText = currentMetric === 'ventas' ? `${item.ventas} ventas` : formatEur(item.euros);
      const subText = currentMetric === 'ventas' ? formatEur(item.euros) : `${item.ventas} ventas`;

      card.innerHTML = `
        <div class="neg-badge">${rank}º</div>
        <div class="neg-advisor-name" title="${item.name}">${item.name}</div>
        <div class="neg-advisor-val">${valText}</div>
        <div style="font-size:12px; color:#cbd5e1; margin-top:2px;">${subText}</div>
        <div class="neg-advisor-brands"><i class="fa-solid fa-tags"></i> ${item.brands_str}</div>
      `;
      podiumEl.appendChild(card);
    });
  }

  function renderChart(dataList) {
    const ctx = document.getElementById('negChart').getContext('2d');

    const labels = dataList.map(d => d.name);
    const values = dataList.map(d => currentMetric === 'ventas' ? d.ventas : d.euros);

    // Paleta de colores para el top 3 vs resto
    const colors = dataList.map((_, i) => {
      if (i === 0) return '#ffd700';
      if (i === 1) return '#c0c0c0';
      if (i === 2) return '#cd7f32';
      return '#00e676';
    });

    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                const item = dataList[context.dataIndex];
                return currentMetric === 'ventas' 
                  ? ` ${item.ventas} ventas (${formatEur(item.euros)})`
                  : ` ${formatEur(item.euros)} (${item.ventas} ventas)`;
              },
              afterLabel: function(context) {
                const item = dataList[context.dataIndex];
                return ' Marcas: ' + item.brands_str;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255,255,255,0.08)' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            grid: { display: false },
            ticks: { color: '#ffffff', font: { weight: 'bold', size: 12 } }
          }
        }
      }
    });
  }

  function renderTable(dataList) {
    const tbody = document.getElementById('negTableBody');
    tbody.innerHTML = '';

    dataList.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:bold; color:${idx < 3 ? '#00e676' : '#94a3b8'}">${idx + 1}º</td>
        <td style="font-weight:600; color:#ffffff;">${item.name}</td>
        <td><b style="color:#00e676;">${item.ventas}</b> ventas</td>
        <td>${formatEur(item.euros)}</td>
        <td style="color:#94a3b8; font-size:12px;">${item.brands_str}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function setMetric(metric) {
    currentMetric = metric;
    document.getElementById('btnMetricVentas').classList.toggle('active', metric === 'ventas');
    document.getElementById('btnMetricEuros').classList.toggle('active', metric === 'euros');
    filterData();
  }

  function setRange(range) {
    currentRange = range;
    document.querySelectorAll('.range-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    filterData();
  }

  document.addEventListener('DOMContentLoaded', function() {
    filterData();
  });
</script>
